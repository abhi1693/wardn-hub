name: Container Image
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Semver image version without a leading v
        required: true
permissions:
  contents: read
  packages: write
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@98222de88f6768904e43a1a92a32e2bdc9a16e4c
    with:
      manifest: .github/images.json
      publish: true
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'skills-v')
