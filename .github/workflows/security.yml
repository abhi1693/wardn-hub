name: Security Checks
on:
  pull_request: null
  push:
    branches:
      - master
permissions:
  contents: read
  pull-requests: read
jobs:
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@59178a1adfb1547da9ba94fdd46962c510b8eb1f
    with:
      runs-on: ubuntu-latest
      node-version: '24'
      workflow-lint: false
      secret-scan-scope: event
      gitleaks-config: .gitleaks.toml
      npm-audit: true
      npm-severity: high
      npm-include-dev: false
      python-audit: true
      python-directory: hub/backend
      python-version: '3.13'
      python-extras: '["dev"]'
      python-include-dev: true
