name: Tests
on:
  pull_request: null
  push:
    branches:
      - master
permissions:
  contents: read
jobs:
  release-identity:
    name: Container release identity guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise immutable-tag and source-version guards
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py'
  backend:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@v1
    with:
      runs-on: ubuntu-latest
      timeout-minutes: 10
      python-version: '3.13'
      working-directory: hub/backend
      enable-cache: true
      sync-command: uv sync --locked --extra dev
      lint-command: uv run ruff check .
      test-command: uv run pytest
      validation-command: bash ../../.github/scripts/check-openapi.sh
      project-env: '{"WARDN_HUB_ENVIRONMENT":"test","WARDN_HUB_API_PREFIX":"/api/v1","WARDN_HUB_LOG_LEVEL":"INFO","WARDN_HUB_API_TOKEN_SECRET":"test-token-secret","WARDN_HUB_API_TOKEN_PREFIX":"wardn_hub","WARDN_HUB_SESSION_COOKIE_NAME":"wardn_hub_session","WARDN_HUB_SESSION_SECRET":"test-session-secret","WARDN_HUB_SESSION_TTL_SECONDS":"43200","WARDN_HUB_REGISTRY_PUBLIC_BASE_URL":"http://localhost:3000","WARDN_HUB_DATABASE_URL":"postgresql+asyncpg://user:pass@localhost:5432/wardn_hub"}'
    name: Backend
  frontend:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@v1
    with:
      checks: '["generate", "lint", "test", "build"]'
      scripts: '{"generate": "ci:frontend-generate", "lint": "web:lint", "test": "test:dependency-security", "build": "web:build"}'
      timeout-minutes: 10
      runs-on: ubuntu-latest
      node-version: '26.12.1'
      cache-dependency-path: package-lock.json
      ignore-scripts: true
      generated-paths: '["hub/frontend/lib/api/generated"]'
    name: Frontend
  images:
    name: Native runtime images
    if: github.event_name == 'pull_request'
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    with:
      manifest: .github/images.json
      version-file: hub/backend/pyproject.toml
      publish: false
      changed-only: false
      scan: true
      scan-ignore-unfixed: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
