[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "wardn-hub-api"
version = "0.2.183"
description = "Wardn Hub backend API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "asyncpg>=0.32.0",
  "cisco-ai-skill-scanner==2.3.1",
  "email-validator>=2.3.0",
  "fastapi>=0.161.0",
  "ftfy>=6.3.1,<7",
  "greenlet>=3.5.6",
  "psycopg[binary]>=3.3.6",
  "pydantic-settings>=2.16.1",
  "prometheus-client>=0.26.0",
  "pwdlib[argon2]>=0.3.1",
  "python-json-logger>=4.2.0",
  "redis>=8.1.0",
  "sqlalchemy[asyncio]>=2.1.6",
  "uvicorn[standard]>=0.54.0",
  "joserfc>=1.7.7",
  "httpx>=0.28.1",
  # LiteLLM requires filelock <4; avoid the SQLite RW-lock introduced in 3.20.4.
  "filelock==3.20.3",
  "markdown-it-py>=4.2.0",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1",
  "opentelemetry-instrumentation-fastapi>=0.66b1",
  "opentelemetry-instrumentation-httpx>=0.66b1",
  "opentelemetry-instrumentation-logging>=0.66b1",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
  "opentelemetry-sdk>=1.45.1",
  "pyyaml>=6.0.3",
  "fastapi-redis-sdk==0.9.1",
  "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.skills" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
